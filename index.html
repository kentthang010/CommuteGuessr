<!doctype html>
<html>
	<head>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<link
			href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css"
			rel="stylesheet"
		/>
		<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
			integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
			crossorigin=""
		/>
		<link
			rel="stylesheet"
			href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css"
		/>
		<script
			src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
			integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
			crossorigin=""
		></script>
		<script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
		<script src="map.js" defer></script>
		<link rel="stylesheet" href="styles.css" />
		<title>CommuteGuessr</title>
	</head>

	<!-- <body style="background-color: #222222"> -->
	<body style="background-color: #ca8585">
		<div
			class="container mx-auto flex flex-col my-auto items-center justify-center h-screen gap-1"
		>
			<h1 class="text-3xl font-bold">CommuteGuessr</h1>
			<div class="w-100 h-75" id="map"></div>
			<div class="bg-white w-100 rounded-lg grid grid-cols-4 gap-3 py-2">
				<div
					class="col-span-2 mx-auto my-auto text-lg text-shadow-lg font-bold text-center ps-3"
				>
					<p id="locationInfo">Guess your commute time!</p>
					<p id="transportmodeimgid"></p>
				</div>
				<div id="guessingbox" class="col-span-1">
					<form
						class="flex flex-col items-center"
						id="guessForm"
						name="guessForm"
					>
						<div class="flex flex-row">
							<input
								type="number"
								id="guessH"
								class="form-control"
								placeholder="Hours"
							/>
							<input
								type="number"
								id="guessM"
								class="form-control"
								placeholder="Minutes"
							/>
						</div>
						<input
							type="submit"
							class="btn btn-primary w-100"
							value="Submit Guess"
						/>
					</form>
					<div
						class="mx-auto flex flex-col items-center justify-center gap-1 hidden"
						id="scoreDisplay"
					>
						<p id="scoreText"></p>
						<p id="guessDistanceText"></p>
						<button
							type="button"
							class="btn btn-primary w-100"
							onclick="nextRound()"
						>
							Next Round
						</button>
					</div>
				</div>
				<div
					class="col-span-1 my-auto mx-auto text-xl text-shadow-lg font-bold"
				>
					<p id="totalScoreDisplay">Total Score: 0</p>
				</div>
			</div>
		</div>
	</body>
</html>
